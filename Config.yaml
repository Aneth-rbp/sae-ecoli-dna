seed: 42

paths:
  raw: data/raw
  processed: data/processed
  results: results
  figures: figures
  embeddings: data/embeddings

sources:
  genomeFasta:
    url: https://ftp.ncbi.nlm.nih.gov/genomes/all/GCF/000/005/845/GCF_000005845.2_ASM584v2/GCF_000005845.2_ASM584v2_genomic.fna.gz
    file: GCF_000005845.2_genomic.fna.gz
    version: GCF_000005845.2 (ASM584v2)
  genomeGff:
    url: https://ftp.ncbi.nlm.nih.gov/genomes/all/GCF/000/005/845/GCF_000005845.2_ASM584v2/GCF_000005845.2_ASM584v2_genomic.gff.gz
    file: GCF_000005845.2_genomic.gff.gz
    version: GCF_000005845.2 (ASM584v2)
  uniprotProteome:
    url: https://rest.uniprot.org/uniprotkb/stream?query=proteome:UP000000625&format=tsv&fields=accession,reviewed,gene_primary,gene_oln,go_id&compressed=true
    file: UP000000625.tsv.gz
    versionHeader: X-UniProt-Release
  goBasic:
    url: https://current.geneontology.org/ontology/go-basic.obo
    file: go-basic.obo
    versionFromObo: true

model:
  name: evo2_7b
  precision: bfloat16
  # Local evo2_7b.pt; null downloads it from Hugging Face.
  checkpointPath: null
  # 32 blocks, hidden size 4096 (evo2 configs/evo2-7b-1m.yml); fixed in #3.
  layer: blocks.28.mlp.l3
  maxNucleotides: 1000
  # Pooled rows per checkpoint shard; a restart redoes at most one shard.
  checkpointEvery: 256

windows:
  length: 1000
  step: 500
  strands: both

sae:
  # Chosen in #31 by the rule below.
  features: 128
  k: 32
  validationFraction: 0.2
  epochs: 20
  batchSize: 512
  learningRate: 0.001
  # Rule from #14 and #31: largest dictionary with a passing k (explained variance >= min, dead fraction < max), then its smallest k.
  featureCandidates: [64, 128, 256]
  kCandidates: [16, 32]
  minExplainedVariance: 0.8
  maxDeadFraction: 0.2

enrichment:
  topN: 50
  minTermGenes: 5
  maxTermGenes: 500
  fdr: 0.05
  fdrScope: perFeature

compare:
  candidates: 5

figures:
  dpi: 300
  # Single report column (8.5 cm); the table spans the text width.
  histogramWidthInches: 3.35
  histogramHeightInches: 2.3
  tableWidthInches: 6.9
  fontSize: 7
  histogramBins: 30
  tableFeatures: 4
  showPositiveMode: false
